server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(?:jpg|jpeg|png|webp|svg|js|css)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location ~* \.(?:html|xml|txt)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
}
